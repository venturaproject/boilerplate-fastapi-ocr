services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MEDIA_DIR: /app/backend/media
      APP_NAME: ${APP_NAME:-FastAPI OCR}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_LANG: ${OCR_LANG:-es}
      OCR_USE_GPU: ${OCR_USE_GPU:-false}
      THROTTLE_OCR: ${THROTTLE_OCR:-30/60}
      OCR_MAX_IMAGE_MEGAPIXELS: ${OCR_MAX_IMAGE_MEGAPIXELS:-40}
      OCR_ALLOWED_LANGS: ${OCR_ALLOWED_LANGS:-}
      OCR_SORT_READING_ORDER: ${OCR_SORT_READING_ORDER:-true}
      OCR_SYNC_CACHE_TTL_SECONDS: ${OCR_SYNC_CACHE_TTL_SECONDS:-300}
      OCR_WARMUP_ON_STARTUP: ${OCR_WARMUP_ON_STARTUP:-true}
      OCR_WARMUP_LANGS: ${OCR_WARMUP_LANGS:-}
      OCR_CALLBACK_ALLOW_PRIVATE: ${OCR_CALLBACK_ALLOW_PRIVATE:-false}
      OCR_CALLBACK_ALLOWED_HOSTS: ${OCR_CALLBACK_ALLOWED_HOSTS:-}
      OCR_CALLBACK_SIGNING_SECRET: ${OCR_CALLBACK_SIGNING_SECRET:-}
    volumes:
      - media_data:/app/backend/media
      - paddle_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy

  ocr-worker:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile
    command: ["uv", "run", "python", "-m", "app.ocr.worker"]
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      MEDIA_DIR: /app/backend/media
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_LANG: ${OCR_LANG:-es}
      OCR_USE_GPU: ${OCR_USE_GPU:-false}
      OCR_MAX_IMAGE_MEGAPIXELS: ${OCR_MAX_IMAGE_MEGAPIXELS:-40}
      OCR_ALLOWED_LANGS: ${OCR_ALLOWED_LANGS:-}
      OCR_SORT_READING_ORDER: ${OCR_SORT_READING_ORDER:-true}
      OCR_WORKER_INTERVAL_SECONDS: ${OCR_WORKER_INTERVAL_SECONDS:-2}
      OCR_JOB_MAX_ATTEMPTS: ${OCR_JOB_MAX_ATTEMPTS:-3}
      OCR_JOB_STALE_SECONDS: ${OCR_JOB_STALE_SECONDS:-900}
      OCR_JOB_RETENTION_DAYS: ${OCR_JOB_RETENTION_DAYS:-7}
      OCR_PURGE_INTERVAL_SECONDS: ${OCR_PURGE_INTERVAL_SECONDS:-3600}
      OCR_WARMUP_ON_STARTUP: ${OCR_WARMUP_ON_STARTUP:-true}
      OCR_WARMUP_LANGS: ${OCR_WARMUP_LANGS:-}
      OCR_CALLBACK_TIMEOUT_SECONDS: ${OCR_CALLBACK_TIMEOUT_SECONDS:-10}
      OCR_CALLBACK_ALLOW_PRIVATE: ${OCR_CALLBACK_ALLOW_PRIVATE:-false}
      OCR_CALLBACK_ALLOWED_HOSTS: ${OCR_CALLBACK_ALLOWED_HOSTS:-}
      OCR_CALLBACK_SIGNING_SECRET: ${OCR_CALLBACK_SIGNING_SECRET:-}
    volumes:
      - media_data:/app/backend/media
      - paddle_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  nginx:
    build:
      context: ./infrastructure/nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  media_data:
  paddle_models:
