global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: ocrer-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # The ocr-worker exposes /metrics only when WORKER_METRICS_PORT is set
  # (the observability overlay sets it to 9100).
  - job_name: ocrer-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["ocr-worker:9100"]
