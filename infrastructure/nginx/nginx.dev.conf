server {
    listen 80;
    server_tokens off;

    client_max_body_size 60M;

    # Security headers (no HSTS/CSP in dev — CSP would break Vite HMR)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # OCR endpoints: larger uploads + long-running synchronous inference
    location ~ ^/api/(ext|v1)/ocr {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Prometheus metrics (dev convenience; in prod, scrape backend:8000 directly)
    location = /metrics {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # API and media
    location ~ ^/(api|media)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # SPA admin route must go to frontend
    location /admin {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    # Vite dev server + HMR WebSocket
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
    }
}
