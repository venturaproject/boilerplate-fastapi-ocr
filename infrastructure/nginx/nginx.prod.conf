server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ── Security headers (served on every response) ──────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — only meaningful once HTTPS terminates in front of / at this nginx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # SPA CSP. Tune if a dependency needs more (e.g. a CDN). No inline/eval scripts.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # OCR endpoints: larger uploads + long-running synchronous inference
    location ~ ^/api/(ext|v1)/ocr {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API and media
    location ~ ^/(api|media)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # Hashed build assets — cache hard (no add_header here so the security
    # headers above still apply; `expires` sets Cache-Control on its own).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA — every other path (incl. /admin) serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
