services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile.dev
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      SECRET_KEY: ${SECRET_KEY}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      JWT_ISSUER: ${JWT_ISSUER:-fastapi-ocr}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fastapi-ocr-frontend}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MEDIA_DIR: /app/backend/media
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      APP_NAME: ${APP_NAME:-Ocrer}
      APP_URL: ${APP_URL:-http://localhost}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_LANG_AUTODETECT: ${OCR_LANG_AUTODETECT:-false}
      TESSERACT_CMD: ${TESSERACT_CMD:-}
      OCR_LANG: ${OCR_LANG:-es}
      OCR_USE_GPU: ${OCR_USE_GPU:-false}
      OCR_PADDLE_MKLDNN: ${OCR_PADDLE_MKLDNN:-false}
      THROTTLE_OCR: ${THROTTLE_OCR:-30/60}
      OCR_MAX_IMAGE_MEGAPIXELS: ${OCR_MAX_IMAGE_MEGAPIXELS:-40}
      OCR_ALLOWED_LANGS: ${OCR_ALLOWED_LANGS:-}
      OCR_SORT_READING_ORDER: ${OCR_SORT_READING_ORDER:-true}
      OCR_CLASSIFIER: ${OCR_CLASSIFIER:-rules}
      OCR_EXTRACTOR: ${OCR_EXTRACTOR:-rules}
      DOCUMENT_REDACT_PII: ${DOCUMENT_REDACT_PII:-false}
      OCR_SYNC_CACHE_TTL_SECONDS: ${OCR_SYNC_CACHE_TTL_SECONDS:-300}
      OCR_WARMUP_ON_STARTUP: ${OCR_WARMUP_ON_STARTUP:-true}
      OCR_WARMUP_LANGS: ${OCR_WARMUP_LANGS:-}
      OCR_CALLBACK_ALLOW_PRIVATE: ${OCR_CALLBACK_ALLOW_PRIVATE:-false}
      OCR_CALLBACK_ALLOWED_HOSTS: ${OCR_CALLBACK_ALLOWED_HOSTS:-}
      OCR_CALLBACK_SIGNING_SECRET: ${OCR_CALLBACK_SIGNING_SECRET:-}
      OCR_CALLBACK_MAX_ATTEMPTS: ${OCR_CALLBACK_MAX_ATTEMPTS:-5}
      OCR_CALLBACK_BACKOFF_BASE_SECONDS: ${OCR_CALLBACK_BACKOFF_BASE_SECONDS:-60}
      OCR_BATCH_MAX_FILES: ${OCR_BATCH_MAX_FILES:-50}
      OCR_DEFAULT_MONTHLY_PAGE_QUOTA: ${OCR_DEFAULT_MONTHLY_PAGE_QUOTA:-0}
    volumes:
      - ./backend:/app/backend
      - ./infrastructure:/app/infrastructure
      - backend_venv:/app/backend/.venv
      - uv_cache:/root/.cache/uv
      - paddle_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy

  ocr-worker:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile.dev
    entrypoint: []
    command: >
      sh -c "cd /app/backend &&
      (case "$${OCR_ENGINE:-paddle}" in fake) uv sync;; tesseract) uv sync --extra tesseract;; *) uv sync --extra paddle;; esac) &&
      uv run python -m app.ocr.worker"
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      SECRET_KEY: ${SECRET_KEY}
      MEDIA_DIR: /app/backend/media
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_LANG_AUTODETECT: ${OCR_LANG_AUTODETECT:-false}
      TESSERACT_CMD: ${TESSERACT_CMD:-}
      OCR_LANG: ${OCR_LANG:-es}
      OCR_USE_GPU: ${OCR_USE_GPU:-false}
      OCR_PADDLE_MKLDNN: ${OCR_PADDLE_MKLDNN:-false}
      OCR_MAX_IMAGE_MEGAPIXELS: ${OCR_MAX_IMAGE_MEGAPIXELS:-40}
      OCR_ALLOWED_LANGS: ${OCR_ALLOWED_LANGS:-}
      OCR_SORT_READING_ORDER: ${OCR_SORT_READING_ORDER:-true}
      OCR_CLASSIFIER: ${OCR_CLASSIFIER:-rules}
      OCR_EXTRACTOR: ${OCR_EXTRACTOR:-rules}
      DOCUMENT_REDACT_PII: ${DOCUMENT_REDACT_PII:-false}
      OCR_WORKER_INTERVAL_SECONDS: ${OCR_WORKER_INTERVAL_SECONDS:-2}
      OCR_JOB_MAX_ATTEMPTS: ${OCR_JOB_MAX_ATTEMPTS:-3}
      OCR_JOB_STALE_SECONDS: ${OCR_JOB_STALE_SECONDS:-900}
      OCR_JOB_RETENTION_DAYS: ${OCR_JOB_RETENTION_DAYS:-7}
      OCR_PURGE_INTERVAL_SECONDS: ${OCR_PURGE_INTERVAL_SECONDS:-3600}
      OCR_WARMUP_ON_STARTUP: ${OCR_WARMUP_ON_STARTUP:-true}
      OCR_WARMUP_LANGS: ${OCR_WARMUP_LANGS:-}
      OCR_CALLBACK_TIMEOUT_SECONDS: ${OCR_CALLBACK_TIMEOUT_SECONDS:-10}
      OCR_CALLBACK_ALLOW_PRIVATE: ${OCR_CALLBACK_ALLOW_PRIVATE:-false}
      OCR_CALLBACK_ALLOWED_HOSTS: ${OCR_CALLBACK_ALLOWED_HOSTS:-}
      OCR_CALLBACK_SIGNING_SECRET: ${OCR_CALLBACK_SIGNING_SECRET:-}
      OCR_CALLBACK_MAX_ATTEMPTS: ${OCR_CALLBACK_MAX_ATTEMPTS:-5}
      OCR_CALLBACK_BACKOFF_BASE_SECONDS: ${OCR_CALLBACK_BACKOFF_BASE_SECONDS:-60}
      OCR_BATCH_MAX_FILES: ${OCR_BATCH_MAX_FILES:-50}
      OCR_DEFAULT_MONTHLY_PAGE_QUOTA: ${OCR_DEFAULT_MONTHLY_PAGE_QUOTA:-0}
    volumes:
      - ./backend:/app/backend
      - ./infrastructure:/app/infrastructure
      - backend_venv:/app/backend/.venv
      - uv_cache:/root/.cache/uv
      - paddle_models:/root/.paddleocr
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: infrastructure/backend/Dockerfile.dev
    entrypoint: []
    # Keep the shared backend_venv in sync with the same extras the backend uses.
    command: >
      sh -c "cd /app/backend &&
      (case "$${OCR_ENGINE:-paddle}" in fake) uv sync;; tesseract) uv sync --extra tesseract;; *) uv sync --extra paddle;; esac) &&
      uv run python -m app.events.worker"
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      SECRET_KEY: ${SECRET_KEY}
      OCR_ENGINE: ${OCR_ENGINE:-paddle}
      OCR_LANG_AUTODETECT: ${OCR_LANG_AUTODETECT:-false}
      TESSERACT_CMD: ${TESSERACT_CMD:-}
      JWT_ISSUER: ${JWT_ISSUER:-fastapi-ocr}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fastapi-ocr-frontend}
    volumes:
      - ./backend:/app/backend
      - ./infrastructure:/app/infrastructure
      - backend_venv:/app/backend/.venv
      - uv_cache:/root/.cache/uv
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/frontend/Dockerfile
    command: sh -c "pnpm install && pnpm dev -- --host"
    environment:
      VITE_APP_NAME: ${VITE_APP_NAME:-Ocrer}
      VITE_BACKEND_URL: http://backend:8000
      VITE_PUBLIC_API_URL: ""
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend

  nginx:
    build:
      context: ./infrastructure/nginx
    ports:
      - "${NGINX_PORT:-8081}:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  backend_venv:
  uv_cache:
  frontend_modules:
  paddle_models:
