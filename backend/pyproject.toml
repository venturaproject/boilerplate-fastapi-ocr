[project]
name = "boilerplate-fastapi-ocr"
version = "0.1.0"
description = "FastAPI OCR API powered by PaddleOCR — sync endpoint + async jobs, Bearer-token external API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1.0",
    "itsdangerous>=2.2.0",
    "python-decouple>=3.8",
    "httpx>=0.28.0",
    "pillow>=10.4.0",
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# OCR engine — heavy (paddlepaddle ~1 GB). Installed inside the container image.
# For local dev / CI without it, set OCR_ENGINE=fake.
paddle = [
    "paddleocr>=2.9.0,<3.0.0",
    "paddlepaddle>=2.6.0,<3.0.0",
    "setuptools>=70.0.0",  # paddlepaddle imports it at runtime (cpp_extension)
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "RUF012",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
